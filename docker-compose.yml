services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kkd}
      POSTGRES_USER: ${POSTGRES_USER:-kkd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkd_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kkd}
      DB_USER: ${POSTGRES_USER:-kkd}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kkd_local}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  tools:
    image: maven:3.9.9-eclipse-temurin-17
    profiles: ["tools"]
    working_dir: /project
    volumes:
      - .:/project
      - maven-cache:/root/.m2
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kkd}
      DB_USER: ${POSTGRES_USER:-kkd}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kkd_local}
      IT_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-kkd}
      IT_DB_USER: ${POSTGRES_USER:-kkd}
      IT_DB_PASSWORD: ${POSTGRES_PASSWORD:-kkd_local}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["mvn", "-B"]
    command: ["test"]
volumes:
  pgdata:
  maven-cache:
