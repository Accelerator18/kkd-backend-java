server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
spring:
  application:
    name: kkd-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kkd}
    username: ${DB_USER:kkd}
    password: ${DB_PASSWORD:kkd_local}
    hikari:
      maximum-pool-size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    property-naming-strategy: SNAKE_CASE
    parser:
      strict-duplicate-detection: true
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  seed-demo: ${SEED_DEMO:true}
